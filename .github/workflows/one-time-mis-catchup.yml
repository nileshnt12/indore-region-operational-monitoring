name: One-time MIS Catch-up Retry

on:
  push:
    paths:
      - '.github/workflows/one-time-mis-catchup.yml'

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Catch up MIS reports
        run: node scripts/fetch-mis-to-supabase.mjs
