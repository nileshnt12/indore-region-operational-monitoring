name: One-time MIS Backfill Last Week

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/one-time-backfill-last-week.yml

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        report_date:
          - '2026-09-27'
          - '2026-09-28'
          - '2026-09-29'
          - '2026-09-30'
          - '2026-10-01'
          - '2026-10-02'
          - '2026-10-03'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REPORT_DATE: ${{ matrix.report_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill MIS report and upsert Supabase
        run: node scripts/fetch-mis-to-supabase.mjs
